<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>無垢の国ウロボロシア公式ホームページ</title>

        <style>
            
        body {
            background-color: black;
            color: white;
        }

        #welcome {
            font-size: 40px;
            animation: fade 1s;
            top: 30%;
            left: 30%;
        }

        @keyframes fade {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }

            100% {
                transform: translateY(0px);
                opacity: 1;
            }
        }

            .hello {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            
        </style>
    </head>

    <body>
        <div class="hello">
        <h1 id="welcome">ようこそ、無垢の国ウロボロシア<br>公式ホームページへ</h1>
        </div>

        
    </body>
</html>
