<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>無垢の国ウロボロシア公式ホームページ</title>

        <style>

            body {
                margin: 0;
            }

            .ouroborosia {
                text-align: center;
            }

            #hello {
                font-size: 30px;
                animation: move 2s ease-out forwards;
            }

            @keyframes move {
                0% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                50% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                100% {
                    transform: translateY(0px);
                    opacity: 1;
                }
            }

                .text1 {
                    display: flex;
                    justify-content: center;
                    gap: 30px;
                    margin: 0 auto;
                    align-items: center;
                    max-width: 800px;
                    width: 60%;
                    background-color: white;
            }

            #castle {
                animation: fly 1s alternate infinite;
                max-width: 320px;
                width: 50%;
                height: auto;
            }

            @keyframes fly {
                0% {
                    transform: translateY(30px)
                }

                100% {
                    transform: translateY(0px)
                }
            }

            .black {
                background-color: black;
                width: 120%;
                height: 100px;
                top: 0;
                left: 0;
                display: flex;
                align-items: center;
            } 

            #title {
                color: white;
            }

            #flag {
                max-width: 800px;
                width: 100%;
                height: auto;
            }

        </style>
    </head>

    <body>
        <div class="black"><h3 id="title">ouroborosia</h3></div>
        <div class="ouroborosia">
        <img src="d10969f44dd21c8eeac48fd6a1e33951a64df7b28621c13346c236a732f8f813.gif" id="flag">
        <p id="hello">ようこそ、無垢の国ウロボロシアへ</p>
        
        </div>

        <div class="text1">
            <img src="90262751fb1651f3.webp" id="castle">
                <div>
            <h1>ウロボロシアって<br>どんな国？</h1>
            <p id="synopsis">アベリア大陸北西部に位置する博打の国。
            <br>モットーは「富国強兵」！
            <br>楽しく生きることを至上とする娯楽主義の国家です！</p> 
            </div>
        </div>
    </body>
</html>
