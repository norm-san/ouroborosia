<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>無垢の国ウロボロシア公式ホームページ</title>

        <style>

            .ouroborosia {
                text-align: center;
            }

            #hello {
                font-size: 30px;
                animation: move 1s ease-out;
                opacity: 0;
                animation-timeline: view();
            }

            @keyframes move {
                0% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                100% {
                    transform: translateY(0px);
                    opacity: 1;
                }
            }

                .text1 {
                    display: flex;
                    justify-content: center;
                    gap: 30px;
                    margin: 0 auto;
            }

            #castle {
                animation: fly 1s alternate infinite;
                width: 320px;
                height: 400px;
            }

            @keyframes fly {
                0% {
                    transform: translateY(30px)
                }

                100% {
                    transform: translateY(0px)
                }
            }

        </style>
    </head>

    <body>
        <div class="ouroborosia">
        <p id="hello">ようこそ、ウロボロシアへ</p>
        </div>

        <div class="text1">
            <img src="90262751fb1651f3.webp" id="castle">
            <p>ここにテキストを挿入
            <br>ここにテキストを挿入
            <br>ここにテキストを挿入</p>
        </div>
    </body>
</html>
