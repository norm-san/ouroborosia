<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>無垢の国ウロボロシア公式ホームページ</title>

        <style>

            body {
                margin: 0;
                color: white;
            }

                .background {
    position: relative;
    background-image: url("Screenshot 2026-08-30 19.52.10.png");
    background-size: cover;
    background-attachment: fixed;
}

.background::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.8);
}

            .ouroborosia,
.text1,
.sidebar {
    position: relative;
    z-index: 1;
}
            
            .ouroborosia {
                text-align: center;
                justify-content: center;
            }

            #hello {
    position: absolute;
    top: 40%;
    left: calc(25% - 100px);

    font-size: 40px;
    color: white;

    animation: move 2s ease-out forwards;
    z-index: 2;
}

            @keyframes move {
                0% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                50% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                100% {
                    transform: translateY(0px);
                    opacity: 1;
                }
            }

                .text1 {
                    display: flex;
                    justify-content: center;
                    gap: 30px;
                    margin: 0 auto;
                    align-items: center;
                    max-width: 800px;
                    width: 80%;
            }

            #castle {
                animation: fly 1s alternate infinite;
                max-width: 320px;
                width: 50%;
                height: auto;
            }

            @keyframes fly {
                0% {
                    transform: translateY(30px);
                }

                100% {
                    transform: translateY(0px);
                }
            }

            

            #flag {
                height: auto;
                display: block;
                width: 100%;
            }

            .flagImg {
                position: relative;
                justify-content: center;
                align-items: center;
                text-align: center;
                max-width: 800px;
                width: 100%;
                margin: 0 auto;
}


            .flagImg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
}

            .sidebar {
    position: fixed;

    top: 0;
    right: 0;

    width: 220px;
    height: 100%;

    background-color: black;
    border: 2px solid white;
    border-radius: 20px;

    padding: 30px;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;

    margin: 20px 0;
}

            

        </style>
    </head>

    <body>

        <div class="background">

            <div class="sidebar">
    <h2>MENU</h2>

    <a href="#" id="home">ホーム</a>
    <a href="#"id="about">ウロボロシアについて</a>
    <a href="#" id="info">国家情報</a>
</div>
        
        <div class="ouroborosia">
        <div class="flagImg"><img src="d10969f44dd21c8eeac48fd6a1e33951a64df7b28621c13346c236a732f8f813.gif" id="flag">
        <p id="hello">ようこそ、無垢の国ウロボロシアへ</p>
        </div>
        
        
        </div>


        <div class="text1">
            <img src="90262751fb1651f3.webp" id="castle">
                <div>
            <h1>ウロボロシアって<br>どんな国？</h1>
            <p id="synopsis">アベリア大陸北西部に位置する博打の国。
            <br>モットーは「富国強兵」！
            <br>楽しく生きることを至上とする娯楽主義の国家です！</p> 
            </div>
        </div>

        <div>
        </div>

            

        </div><!-- .backgroundの終焉 -->
    </body>
</html>
