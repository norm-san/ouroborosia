<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>無垢の国ウロボロシア公式ホームページ</title>

        <style>
            
        body {
            background-color: black;
            color: white;
            margin: 0;
        }

        #welcome {
            position: absolute;
            font-size: 40px;
            animation: fade 1s;
            left: 10%;
        }

        @keyframes fade {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }

            100% {
                transform: translateY(0px);
                opacity: 1;
            }
        }

            .hello {
                display: flex;
                align-items: center;
                height: 100vh;
                width: 100%;
                z-index: 2;
            }

            .hello img {
                margin: 0 auto;
                width: 60%;
                height: auto;
                opacity: 0.2;
                z-index: 1;
            }

            .green {
                background-color: green;
                border-radius: 10px;
                height: 30px;
                width: 100px;
                text-align: center;
                position: absolute;
                left: 10%;
                top: 60%;
                z-index: 3;
            }

            .green a {
                color: white;
                text-decoration: none;
            }

            .news {
                text-align: center;
            }

            .about {
                text-align: center;
            }

            .text1 {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 30px;
            }

            .text1 img {
                width: 320px;
                height: auto;
            }

            .left {
                text-align: left;
            }
            
        </style>
    </head>

    <body>
        <div class="hello">
        <h1 id="welcome">ようこそ、無垢の国ウロボロシア<br>公式ホームページへ</h1>
        <div class="green"><a href="about.html">詳細を見る</a></div>
        <img src="d10969f44dd21c8eeac48fd6a1e33951a64df7b28621c13346c236a732f8f813.gif">
        </div>


        <div class="news">
        <h1>NEWS</h1>
        <p>未設定</p>
        </div>

        <div class="about">
        <h1>ABOUT</h1>
        <div class="text1">
            <img src="90262751fb1651f3.webp">
            <div class="left">
            <h1>ウロボロシアってどんな国？</h1>
            <p>アベリア大陸北西部に位置する、
            <br>「富国強兵」がモットーの
            <br>娯楽主義国家です！</p>
            </div>
        </div>
        </div>

        
    </body>
</html>
