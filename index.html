<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>無垢の国ウロボロシア公式ホームページ</title>

        <style>

            .ouroborosia {
                text-align: center;
            }

            #hello {
                font-size: 30px;
                animation: move 1s ease-out forwards;
            }

            @keyframes move {
                0% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                100% {
                    transform: translateY(0px);
                    opacity: 1;
                }
            }

                .text1 {
                    display: flex;
                    justify-content: center;
                    gap: 30px;
                    margin: 0 auto;
                    align-items: center;
            }

            #castle {
                animation: fly 1s alternate infinite;
                width: 320px;
                height: 400px;
            }

            @keyframes fly {
                0% {
                    transform: translateY(30px)
                }

                100% {
                    transform: translateY(0px)
                }
            }

            #synopsis {
                transform: translateY(50px);
            }

        </style>
    </head>

    <body>
        <div class="ouroborosia">
        <p id="hello">ようこそ、無垢の国ウロボロシアへ</p>
        <h1>私たちについて</h1>
        </div>

        <div class="text1">
            <img src="90262751fb1651f3.webp" id="castle">
            <p id="synopsis">アベリア大陸北西部に位置する博打の国。
            <br>モットーは「富国強兵」！
            <br>楽しく生きることを至上とする娯楽主義です！</p>
        </div>
    </body>
</html>
