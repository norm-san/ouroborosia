<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>こんにちは</title>

        <style>

            .ouroborosia {
                text-align: center;
            }

            #hello {
                font-size: 30px;
                animation: move 1s ease-out;
            }

            @keyframes move {
                0% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                100% {
                    transform: translateY(0px);
                    opacity: 1;
                }
            }

        </style>
    </head>

    <body>
        <div class="ouroborosia">
        <p id="hello">ようこそ、ウロボロシアへ</p>
        </div>
    </body>
</html>
