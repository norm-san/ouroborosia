<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>無垢の国ウロボロシア公式ホームページ</title>

        <style>

            body {
                margin: 0;
                color: white;
                background-color: black;
            }

                

            .ouroborosia,
.text1 {
    position: relative;
    z-index: 1;
}
            
            .ouroborosia {
                text-align: center;
                justify-content: center;
            }

            #hello {
    position: absolute;
    top: 40%;
    left: calc(25% - 100px);

    font-size: 40px;
    color: white;

    animation: move 2s ease-out forwards;
    z-index: 2;
}

            @keyframes move {
                0% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                50% {
                    transform: translateY(30px);
                    opacity: 0;
                }

                100% {
                    transform: translateY(0px);
                    opacity: 1;
                }
            }

                .text1 {
                    display: flex;
                    justify-content: center;
                    gap: 30px;
                    margin: 0 auto;
                    align-items: center;
                    max-width: 800px;
                    width: 80%;
            }

            #castle {
                animation: fly 1s alternate infinite;
                max-width: 320px;
                width: 50%;
                height: auto;
            }

            @keyframes fly {
                0% {
                    transform: translateY(30px);
                }

                100% {
                    transform: translateY(0px);
                }
            }

            

           

            

        </style>
    </head>

    <body>



            
 
        
        <div class="ouroborosia">
        <p id="hello">ようこそ、無垢の国ウロボロシアへ</p>
        </div>
        
        
        </div>


        <div class="text1">
            <img src="90262751fb1651f3.webp" id="castle">
                <div>
            <h1>ウロボロシアって<br>どんな国？</h1>
            <p id="synopsis">アベリア大陸北西部に位置する博打の国。
            <br>モットーは「富国強兵」！
            <br>楽しく生きることを至上とする娯楽主義の国家です！</p> 
            </div>
        </div>

        <div>
        </div>

            

        
    </body>
</html>
